name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o bin/quartr ./cmd/quartr

      - name: Test
        run: go test ./...

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.5
          args: --timeout=3m
